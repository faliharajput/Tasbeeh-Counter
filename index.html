<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasbeeh Counter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="theme-area">
        <button id="themeBtn">🌙 Dark</button>
    </div>

    <main class="tasbeeh">

        <div class="title">
            <span>♡</span>
            <h1>Tasbeeh</h1>
            <span>♡</span>
        </div>

        <p class="subtitle">Digital Tasbeeh Counter</p>

        <div class="counter-circle">

            <div class="inner-circle">
                <span id="count">0</span>
                <small>COUNT</small>
            </div>

        </div>

        <div class="buttons">

            <button id="minusBtn" class="small-btn">
                −
            </button>

            <button id="plusBtn" class="plus-btn">
                +
            </button>

        </div>

        <button id="resetBtn" class="reset-btn">
            ↻ Reset
        </button>

        <p class="dua">"Remember Allah and find peace."</p>

    </main>

    <script src="script.js"></script>

</body>
</html>
